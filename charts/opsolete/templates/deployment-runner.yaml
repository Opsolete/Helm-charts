{{- if and .Values.runner.enabled (eq .Values.runner.mode "deployment") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsolete.fullname" . }}-runner
  labels:
    {{- include "opsolete.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  replicas: {{ .Values.runner.replicas }}
  selector:
    matchLabels:
      {{- include "opsolete.selectorLabels" (list . "runner") | nindent 6 }}
  template:
    {{- include "opsolete.runnerPod" . | nindent 4 }}
{{- end }}
