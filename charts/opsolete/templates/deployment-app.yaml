{{- $wi := .Values.workloadIdentity }}
{{- if and $wi.provider (not (has $wi.provider (list "azure" "aws" "gcp"))) }}
{{- fail "workloadIdentity.provider must be azure, aws or gcp" }}
{{- end }}
{{- /* The app exits on startup without these; fail at render time instead of CrashLoopBackOff. */}}
{{- $c := .Values.config }}
{{- if not $c.STATE_STORE }}
{{- fail "config.STATE_STORE is required (e.g. azblob://tfstate, or file:///tmp/state?create_dir=1 for testing)" }}
{{- end }}
{{- if not (or (and $c.OIDC_ISSUER $c.OIDC_CLIENT_ID) $c.AUTH_DEV_USER) }}
{{- fail "login required: set config.OIDC_ISSUER + config.OIDC_CLIENT_ID (and OIDC_CLIENT_SECRET), or config.AUTH_DEV_USER for testing" }}
{{- end }}
{{- $r := .Values.runner }}
{{- if and $r.enabled (not (and (regexMatch "^[a-z0-9][a-z0-9-]{1,62}$" $r.name) (regexMatch "^[a-z0-9][a-z0-9-]{1,62}$" $r.pool))) }}
{{- fail "runner.name and runner.pool: 2-63 lowercase letters, digits and dashes, starting with a letter or digit" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsolete.fullname" . }}
  labels:
    {{- include "opsolete.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      {{- include "opsolete.selectorLabels" (list . "app") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opsolete.selectorLabels" (list . "app") | nindent 8 }}
        {{- if eq $wi.provider "azure" }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with .Values.app.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # restart on secret changes when the chart owns the secret
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "opsolete.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "opsolete.podSecurityContext" 65532 | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $r.enabled }}
      # Registers the runners' token (RUNNER_TOKEN) before the app starts: app >= 0.8.0 knows runners by their
      # own registered tokens. Again on every start: it replaces the runner's token and pool.
      initContainers:
        - name: register-runner
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          securityContext:
            {{- include "opsolete.containerSecurityContext" . | nindent 12 }}
          command: ["/bin/opsolete", "runner-token", "-from-env", "RUNNER_TOKEN", "-pool", {{ $r.pool | quote }}, {{ $r.name | quote }}]
          env:
            {{- range $k, $v := .Values.config }}
            {{- if $v }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "opsolete.secretName" . }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          securityContext:
            {{- include "opsolete.containerSecurityContext" . | nindent 12 }}
          env:
            - name: ADDR
              value: ":8080"
            {{- range $k, $v := .Values.config }}
            {{- if $v }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "opsolete.secretName" . }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
