{{- if .Values.serviceAccount.create }}
{{- $wi := .Values.workloadIdentity }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opsolete.serviceAccountName" . }}
  labels:
    {{- include "opsolete.labels" . | nindent 4 }}
  annotations:
    {{- if $wi.provider }}
    {{- $id := required "workloadIdentity.identity is required with workloadIdentity.provider" $wi.identity }}
    {{- if eq $wi.provider "azure" }}
    azure.workload.identity/client-id: {{ $id | quote }}
    {{- else if eq $wi.provider "aws" }}
    eks.amazonaws.com/role-arn: {{ $id | quote }}
    {{- else if eq $wi.provider "gcp" }}
    iam.gke.io/gcp-service-account: {{ $id | quote }}
    {{- end }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# The app doesn't call the Kubernetes API; workload identity webhooks project their own token.
automountServiceAccountToken: false
{{- end }}
