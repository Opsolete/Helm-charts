{{- if and .Values.runner.enabled .Values.runner.blockedEgress }}
# Runners may reach anything but runner.blockedEgress: by default the cloud metadata endpoint, so module code
# can't take the node's identity.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsolete.fullname" . }}-runner
  labels:
    {{- include "opsolete.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  podSelector:
    matchLabels:
      {{- include "opsolete.selectorLabels" (list . "runner") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.runner.blockedEgress | nindent 14 }}
        - ipBlock:
            cidr: ::/0
        # in-cluster (the app, DNS): some CNIs don't match pod IPs with ipBlock
        - namespaceSelector: {}
{{- end }}
