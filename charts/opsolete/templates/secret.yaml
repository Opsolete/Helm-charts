{{- if not .Values.secrets.existingSecret }}
{{- /* No generated defaults: a SECRET_KEY that changes on upgrade makes encrypted state unreadable. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsolete.fullname" . }}
  labels:
    {{- include "opsolete.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.DATABASE_URL is required (or set secrets.existingSecret)" .Values.secrets.DATABASE_URL | quote }}
  SECRET_KEY: {{ required "secrets.SECRET_KEY is required (or set secrets.existingSecret)" .Values.secrets.SECRET_KEY | quote }}
  RUNNER_TOKEN: {{ required "secrets.RUNNER_TOKEN is required (or set secrets.existingSecret)" .Values.secrets.RUNNER_TOKEN | quote }}
  {{- with .Values.secrets.OIDC_CLIENT_SECRET }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
