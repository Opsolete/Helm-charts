nameOverride: ""
fullnameOverride: ""

# Plain (non-secret) env vars for the app; see docs/content/docs/operations/configuration.md.
# The chart refuses to render without STATE_STORE and a login method (app >= 0.3.0
# exits on startup without them).
config:
  PUBLIC_URL: https://opsolete.example.com
  # Required. e.g. azblob://tfstate, s3://tfstate?region=eu-west-1, gs://tfstate.
  # Testing only: file:///tmp/state?create_dir=1&metadata=skip (/tmp is an emptyDir,
  # so state is lost on every pod restart; create_dir=1 creates the subfolder).
  STATE_STORE: ""
  # Login (required): OIDC_ISSUER + OIDC_CLIENT_ID (+ secrets.OIDC_CLIENT_SECRET),
  # or AUTH_DEV_USER below.
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: ""
  # Testing only: skips login, every visitor is logged in as this user.
  # AUTH_DEV_USER: dev@example.com
  # Comma-separated; users get admin rights only if their login email is listed
  # here (include AUTH_DEV_USER when using it).
  ADMIN_EMAILS: ""
  # AZURE_STORAGE_ACCOUNT: mystorageaccount   # needed with azblob://

# Secret env vars. Prefer existingSecret (sops / External Secrets) with the keys
# DATABASE_URL, SECRET_KEY, RUNNER_TOKEN and optionally OIDC_CLIENT_SECRET.
# RUNNER_TOKEN is the token of this chart's runners: the app registers it at start (an init container,
# `opsolete runner-token -from-env`) as runner runner.name in runner.pool. Runners elsewhere get their own.
# SECRET_KEY must stay stable and be backed up elsewhere: without it, encrypted state is lost.
secrets:
  existingSecret: ""
  DATABASE_URL: ""
  SECRET_KEY: ""             # openssl rand -base64 32
  RUNNER_TOKEN: ""           # openssl rand -hex 32
  OIDC_CLIENT_SECRET: ""

# Workload identity for the app, so it reaches STATE_STORE without static keys.
# Runners never get it: their cloud credentials come from workspace variables.
workloadIdentity:
  provider: ""               # azure | aws | gcp; empty = off (EKS Pod Identity needs nothing here)
  identity: ""               # azure: managed identity client id, aws: IAM role ARN, gcp: GSA email

serviceAccount:
  create: true
  name: ""
  annotations: {}

imagePullSecrets: []

app:
  replicas: 1
  image:
    repository: ghcr.io/opsolete/opsolete-app
    tag: ""                  # defaults to the chart appVersion
    pullPolicy: IfNotPresent
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

runner:
  enabled: true
  # The name and pool the app registers RUNNER_TOKEN as: the runners of this Deployment are one runner to
  # the app. They get the jobs of projects that use this pool (a project's settings); run a release per pool
  # to keep production credentials on production runners.
  name: k8s
  pool: default
  replicas: 1
  image:
    repository: ghcr.io/opsolete/opsolete-runner
    tag: ""
    pullPolicy: IfNotPresent
  # Extra OPS_* env, e.g. OPS_JOB_TIMEOUT: 45m. OPS_SERVER_URL defaults to the in-cluster Service.
  env: {}
  # The job sandbox (app >= 0.9.0): each Terraform command in its own Linux namespaces, with a private /tmp
  # (https://opsolete.github.io/Opsolete/docs/config/runners/#the-job-sandbox). Sets the runner container's
  # seccomp profile to Unconfined and OPS_SANDBOX=namespaces: the runner then doesn't start where the nodes
  # forbid unprivileged user namespaces (e.g. Ubuntu >= 23.10's AppArmor default). Off: the runner warns.
  sandbox: false
  # IPv4 CIDRs the runners may not reach (a NetworkPolicy; needs a CNI that enforces it): the cloud metadata
  # endpoint, so module code can't take the node's identity. [] adds no policy.
  blockedEgress:
    - 169.254.169.254/32
  # First SIGTERM drains the current job; keep this >= OPS_JOB_TIMEOUT (default 1h).
  terminationGracePeriodSeconds: 3600
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  tlsSecretName: ""          # host is taken from config.PUBLIC_URL
