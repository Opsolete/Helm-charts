name: charts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint (helm lint, yamllint, schema, version bump on PRs) and install on kind.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ct diffs against the target branch
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      # PRs test the changed charts (and must bump their version); main tests all of them.
      - id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "args=--config ct.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "args=--config ct.yaml --all" >> "$GITHUB_OUTPUT"
            # lint-only flag; `ct install` rejects it
            echo "lint_args=--check-version-increment=false" >> "$GITHUB_OUTPUT"
          fi

      - run: ct lint ${{ steps.scope.outputs.args }} ${{ steps.scope.outputs.lint_args }}

      - name: kubeconform (all ci/*-values.yaml)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for chart in charts/*/; do
            for v in "$chart"ci/*-values.yaml; do
              helm template ci "$chart" -f "$v" | ./kubeconform -strict -summary -
            done
          done

      # Guards the render-time checks in deployment-app.yaml: missing STATE_STORE or
      # login must fail `helm template`, not ship a pod that crash-loops.
      - name: opsolete rejects incomplete config
        run: |
          # existingSecret isolates these checks from the secrets.* check in secret.yaml.
          render() { helm template ci charts/opsolete --set secrets.existingSecret=x "$@" 2>&1; }
          expect_fail() { # <expected message> <helm args...>
            msg=$1; shift
            if out=$(render "$@"); then echo "::error::expected render failure for: $*"; exit 1; fi
            echo "$out" | grep -q "$msg" || { echo "::error::wrong failure for: $*"; echo "$out"; exit 1; }
            echo "ok: $* -> $msg"
          }
          expect_fail "STATE_STORE is required" --set config.AUTH_DEV_USER=dev@example.com
          expect_fail "login required" --set config.STATE_STORE=gs://tfstate
          expect_fail "login required" --set config.STATE_STORE=gs://tfstate --set config.OIDC_ISSUER=https://idp.example.com
          render --set config.STATE_STORE=gs://tfstate --set config.AUTH_DEV_USER=dev@example.com >/dev/null
          render --set config.STATE_STORE=gs://tfstate \
            --set config.OIDC_ISSUER=https://idp.example.com --set config.OIDC_CLIENT_ID=opsolete >/dev/null

      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

      - name: Postgres for the install test
        run: |
          kubectl create deployment postgres --image=postgres:17
          kubectl set env deployment/postgres POSTGRES_USER=opsolete POSTGRES_PASSWORD=opsolete POSTGRES_DB=opsolete
          kubectl expose deployment postgres --port=5432
          kubectl rollout status deployment/postgres --timeout=180s

      # Installs with every ci/*-values.yaml and waits until app and runner pods are ready.
      - run: ct install ${{ steps.scope.outputs.args }}

      # ct install only waits for ready pods, and a runner whose token the app doesn't know is ready until
      # its first claim fails. Install once more on a database of its own (ct's left runner k8s seen in the
      # shared one) and check the runner reached the app: no restarts, and Settings -> Runners has seen it.
      - name: opsolete runner connects
        run: |
          kubectl exec deploy/postgres -- createdb -U opsolete e2e
          helm install e2e charts/opsolete -f charts/opsolete/ci/e2e-values.yaml --wait --timeout 5m \
            --set secrets.DATABASE_URL='postgres://opsolete:opsolete@postgres.default.svc:5432/e2e?sslmode=disable'
          sleep 30
          kubectl port-forward svc/e2e-opsolete 8080:80 >/dev/null & pf=$!
          sleep 3
          page=$(curl -sf http://localhost:8080/organization/runners | sed 's/<[^>]*>/ /g' | tr -s ' \n' ' ') || true
          kill $pf
          restarts=$(kubectl get pods -l app.kubernetes.io/instance=e2e,app.kubernetes.io/component=runner \
            -o jsonpath='{.items[*].status.containerStatuses[*].restartCount}')
          if [ "$restarts" != 0 ] || ! echo "$page" | grep -q "k8s default" || echo "$page" | grep -q "k8s default never"; then
            echo "::error::the runner didn't connect (restarts: $restarts)"
            echo "$page" | grep -o "Name Pool.\{0,200\}"
            kubectl logs -l app.kubernetes.io/instance=e2e --all-containers --prefix --tail=30
            exit 1
          fi
          echo "runner k8s connected: $(echo "$page" | grep -o 'k8s default [^D]*')"

  # Package changed chart versions as GitHub releases and update the index on gh-pages.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write # OCI push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      # chart-releaser needs an existing gh-pages branch for index.yaml; bootstrap it on first run.
      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git worktree add --orphan -b gh-pages /tmp/gh-pages
            git -C /tmp/gh-pages commit --allow-empty -m "Initialize gh-pages"
            git -C /tmp/gh-pages push origin gh-pages
            git worktree remove /tmp/gh-pages
          fi
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same packages as OCI artifacts: helm install opsolete oci://ghcr.io/opsolete/charts/opsolete
      - name: Push to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          pkgs=(.cr-release-packages/*.tgz) # only charts whose version changed
          [ ${#pkgs[@]} -eq 0 ] && { echo "nothing to push"; exit 0; }
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for p in "${pkgs[@]}"; do helm push "$p" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"; done
